<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harkhowal Online</title>
<meta name="description" content="Katha by Sant Baba Jagjit Singh Ji Harkhowal Wale. Over 2,000 recordings and the latest divans, organised by Gurmat topic.">
<meta property="og:title" content="Sant Baba Jagjit Singh Ji Harkhowal Wale">
<meta property="og:description" content="Listen to over 2,000 katha recordings and watch the latest divans.">
<meta property="og:image" content="images/babaji.jpg">
<meta name="theme-color" content="#1a1d33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Gurmukhi:wdth,wght@75..125,400..800&family=Mukta+Mahee:wght@400;500;700&display=swap">
<style>
/* Layout: app shell. Sticky header (desktop) / tab bar (phone); views: Home, Listen, Watch, Topic, Series; floating player above everything */
:root{
  --bg:#fcfbf8; --surface:#ffffff; --sunk:#f4f2ee; --ink:#1a1d33; --muted:#686c82; --line:#e7e4de;
  --kesri:#ef8a17; --kesri-ink:#b85f06; --deep:#1a1d33; --deep-ink:#f3f1ec; --deep-muted:#b9bbcc;
  --display:"Anek Gurmukhi","Mukta Mahee",system-ui,sans-serif;
  --body:"Mukta Mahee","Anek Gurmukhi",system-ui,sans-serif;
  --tab:0px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1022; --surface:#161931; --sunk:#121429; --ink:#eceef7; --muted:#9a9fbc; --line:#252948;
  --kesri:#f59d3d; --kesri-ink:#f7b467; --deep:#090b1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1022; --surface:#161931; --sunk:#121429; --ink:#eceef7; --muted:#9a9fbc; --line:#252948;
  --kesri:#f59d3d; --kesri-ink:#f7b467; --deep:#090b1a; color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px))}
body.playing{padding-bottom:calc(var(--tab) + 92px + env(safe-area-inset-bottom,0px))}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--kesri);outline-offset:3px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
h2{font-size:clamp(24px,2.6vw,32px);font-weight:700;line-height:1.15;font-stretch:95%}
.muted{color:var(--muted)}
.icon{width:20px;height:20px;fill:currentColor;flex:none}
.sec{padding-block:44px 0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px}
.sh a,.sh button.link{color:var(--kesri-ink);font-weight:700;text-decoration:none;font-size:15px;background:none;border:0;cursor:pointer;white-space:nowrap}
.sh a:hover{text-decoration:underline}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--deep)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--deep);color:var(--deep-ink)}
.top .wrap{display:flex;align-items:center;gap:8px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;min-width:0}
.logo .mark{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--kesri)}
.logo b{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1;font-stretch:90%}
.logo small{display:block;font-size:12px;color:var(--deep-muted);font-weight:500}
.top nav{display:flex;gap:2px;margin-right:8px}
.top nav a{text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:500;color:var(--deep-muted)}
.top nav a:hover{color:var(--deep-ink)}
.top nav a[aria-current="page"]{color:var(--deep-ink);background:rgba(255,255,255,.1)}
.tb{height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:var(--deep-ink);display:inline-flex;align-items:center;gap:8px;padding:0 14px;cursor:pointer;font-weight:500}
.tb:hover{background:rgba(255,255,255,.12)}
.tb.search{min-width:220px;color:var(--deep-muted)}
.tb.search kbd{margin-left:auto;font-family:inherit;font-size:12px;opacity:.6}
.lang{font-weight:700;font-size:14px;padding:0 12px}

/* tab bar (phone) */
.tabs{display:none}
@media (max-width:760px){
  :root{--tab:64px}
  .top nav,.tb.search span,.tb.search kbd{display:none}
  .tb.search{min-width:0;width:40px;padding:0;justify-content:center}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:44;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  .tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:64px;text-decoration:none;font-size:12px;font-weight:500;color:var(--muted)}
  .tabs a .icon{width:24px;height:24px}
  .tabs a[aria-current="page"]{color:var(--kesri-ink)}
}

/* hero */
.hero{position:relative;color:#fff;overflow:hidden;background:var(--deep)}
.hero .bgimg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(38px) saturate(1.3);opacity:.55;transform:scale(1.1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,16,34,.92) 0%,rgba(14,16,34,.65) 55%,rgba(14,16,34,.35) 100%)}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:center;padding-block:56px 64px}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:5px 12px 5px 10px;border-radius:999px;font-size:14px;font-weight:500;margin-bottom:18px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--kesri);box-shadow:0 0 0 0 rgba(239,138,23,.6);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(239,138,23,0)}100%{box-shadow:0 0 0 0 rgba(239,138,23,0)}}
.hero h1{font-weight:800;font-size:clamp(30px,4vw,50px);line-height:1.3;font-stretch:92%;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hero .where{margin:16px 0 28px;color:rgba(255,255,255,.75);font-size:17px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;border:0;cursor:pointer;font-weight:700;font-size:16px;text-decoration:none;transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn .icon{width:16px;height:16px}
.btn.primary{background:var(--kesri);color:#2a1503}
.btn.primary:hover{background:#f59d3d}
.btn.glass{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22)}
.btn.glass:hover{background:rgba(255,255,255,.2)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.soft:hover{background:var(--line)}
.btn.small{height:40px;padding:0 16px;font-size:15px}
.screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:20px;overflow:hidden;background:#000;border:0;padding:0;cursor:pointer;box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}
.screen img{width:100%;height:100%;object-fit:cover}
.playdisc{position:absolute;inset:0;margin:auto;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--deep);display:grid;place-items:center;transition:transform .2s}
.screen:hover .playdisc{transform:scale(1.07)}
.playdisc svg{width:26px;height:26px;fill:currentColor;margin-left:4px}

/* rails */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:var(--col,300px);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding-inline:max(20px,env(safe-area-inset-left,0px));scroll-padding-inline:max(20px,env(safe-area-inset-left,0px));scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}

/* continue / today cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ccard{display:grid;grid-template-columns:64px minmax(0,1fr) 44px;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;cursor:pointer;width:100%}
.ccard:hover{border-color:var(--kesri)}
.ccard .t{min-width:0}
.ccard .t b{display:block;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .t span{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:4px;background:var(--sunk);border-radius:2px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--kesri)}
.pbtn{width:44px;height:44px;border-radius:50%;background:var(--kesri);color:#2a1503;display:grid;place-items:center;border:0}
.pbtn svg{width:14px;height:14px;fill:currentColor;margin-left:2px}

.today{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.today .art{border-radius:0;aspect-ratio:auto;min-height:220px;font-size:clamp(28px,4vw,48px)}
.today .tx{padding:28px 32px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.today .k{font-size:14px;font-weight:700;color:var(--kesri-ink)}
.today h3{font-size:26px;font-weight:700;line-height:1.2}

/* covers (series art) */
.art{position:relative;display:grid;place-items:center;aspect-ratio:1/1;max-width:100%;border-radius:14px;padding:10px;color:#fff;font-family:var(--display);font-weight:800;line-height:1.15;text-align:center;overflow:hidden;font-size:15px;text-shadow:0 2px 14px rgba(0,0,0,.25);font-stretch:90%}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 115%,rgba(255,255,255,.18) 0 22%,transparent 22.5%),radial-gradient(circle at 105% -10%,rgba(255,255,255,.14) 0 30%,transparent 30.5%)}
.art span{position:relative}
.book{display:flex;flex-direction:column;gap:10px;text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0;width:100%}
.book .art{aspect-ratio:3/4;font-size:clamp(20px,2vw,26px);padding:18px;border-radius:16px;box-shadow:0 18px 30px -18px rgba(26,29,51,.45)}
.book .art::after{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent)}
.book>b{display:block;font-weight:700;line-height:1.3}
.book>.cnt{display:block;font-size:14px;color:var(--muted)}
.book:hover>b{color:var(--kesri-ink)}
.grid-books{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:28px 20px}

/* topics */
.topics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.topic{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:150px;border-radius:20px;padding:18px;color:#fff;text-decoration:none;overflow:hidden;transition:transform .15s}
.topic:hover{transform:translateY(-2px)}
.topic::before{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.topic b{position:relative;font-family:var(--display);font-weight:800;font-size:clamp(26px,2.6vw,34px);line-height:1.1}
.topic span{position:relative;font-size:14px;opacity:.9}
.topic span strong{display:block;font-size:16px}

/* videos */
.vcard{display:flex;flex-direction:column;gap:10px;text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0;width:100%}
.vthumb{position:relative;aspect-ratio:16/9;max-width:100%;width:100%;border-radius:14px;overflow:hidden;background:var(--sunk)}
.vthumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.vcard:hover .vthumb img{transform:scale(1.04)}
.vthumb .new{position:absolute;left:10px;top:10px;background:var(--kesri);color:#2a1503;font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px}
.vthumb .mini{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:rgba(10,12,26,.7);color:#fff;display:grid;place-items:center}
.vthumb .mini svg{width:13px;height:13px;fill:currentColor;margin-left:2px}
.vcard b{font-weight:700;font-size:16px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vcard span{font-size:14px;color:var(--muted)}
.grid-v{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px 22px}

/* page heads */
.phead{padding-block:40px 8px}
.phead h1{font-size:clamp(34px,4.5vw,54px);font-weight:800;line-height:1.1;font-stretch:90%}
.phead p{margin:10px 0 0;color:var(--muted);max-width:60ch}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:20px 0 26px;flex-wrap:wrap}
.toolbar .chips{flex:1;min-width:0}
select.sort{height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;padding:0 14px}

/* topic page */
.thead{color:#fff;padding-block:48px 44px;position:relative;overflow:hidden}
.thead::before{content:"";position:absolute;right:-80px;top:-80px;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.1)}
.thead .wrap{position:relative}
.thead a.back{color:rgba(255,255,255,.8);text-decoration:none;font-weight:500;font-size:15px}
.thead h1{font-size:clamp(48px,7vw,88px);font-weight:800;line-height:1.05;margin-top:10px}
.thead p{font-size:19px;max-width:52ch;margin:8px 0 0;opacity:.9}

/* series page */
.shead{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;align-items:end;padding-block:40px 28px;border-bottom:1px solid var(--line)}
.shead .art{aspect-ratio:3/4;font-size:28px;padding:20px;border-radius:18px;box-shadow:0 24px 40px -22px rgba(26,29,51,.5)}
.shead h1{font-size:clamp(32px,4vw,48px);font-weight:800;line-height:1.15}
.shead .en{font-weight:700;font-size:19px;margin-top:4px}
.shead .meta{color:var(--muted);margin:6px 0 20px}
.shead .acts{align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;height:40px}
.seg button{border:0;background:var(--surface);padding:0 14px;font-size:14px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rows{display:flex;flex-direction:column}
.grp{font-family:var(--display);font-weight:700;font-size:16px;color:var(--muted);padding:26px 4px 8px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.row:hover{background:var(--sunk)}
.row .pp{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.row .pp svg{width:12px;height:12px;fill:currentColor;margin-left:2px}
.row.on .pp{background:var(--kesri);border-color:var(--kesri);color:#2a1503}
.row.on b{color:var(--kesri-ink)}
.row .t{min-width:0}
.row b{display:block;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.row .t span{font-size:14px;color:var(--muted)}
.row .d{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* about */
.about{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.about .ph{height:100%;min-height:380px;background:url("images/babaji.jpg") center 30%/cover}
.about .tx{padding:40px 40px 40px 0}
.about h2{margin-bottom:14px}
.about p{margin:0 0 14px;color:var(--muted);max-width:58ch}
.lineage{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;list-style:none;padding:0}
.lineage li{font-size:14px;padding:5px 12px;border-radius:999px;background:var(--sunk)}
.lineage li:last-child{background:var(--kesri);color:#2a1503;font-weight:700}

/* footer */
footer{margin-top:72px;background:var(--deep);color:var(--deep-ink)}
footer .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;padding-block:44px}
footer .fateh{font-family:var(--display);font-weight:700;font-size:22px;color:var(--kesri);margin-bottom:8px}
footer p{margin:0 0 6px;color:var(--deep-muted);font-size:15px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.links a{text-decoration:none;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2);font-size:15px}
.links a:hover{background:rgba(255,255,255,.08)}
.mail{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.mail code{font-family:inherit;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:8px;user-select:all}
.mail button{background:none;border:1px solid rgba(255,255,255,.25);color:var(--deep-ink);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14px}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,12,26,.66);display:flex;justify-content:center;align-items:flex-start;padding:max(56px,env(safe-area-inset-top,0px)) 16px 16px;backdrop-filter:blur(4px)}
.sbox{width:min(720px,100%);max-height:82vh;background:var(--bg);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.sbox .in{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sbox input{flex:1;border:0;background:none;outline:none;font:inherit;font-size:19px;color:var(--ink);min-width:0}
.sres{overflow:auto;padding:6px 16px 16px}
.sres h4{margin:16px 4px 4px;font-family:var(--display);font-size:15px;color:var(--muted)}
.hint{padding:24px 8px;color:var(--muted)}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.x svg{width:15px;height:15px;fill:currentColor}
.vm{width:min(1040px,100%);background:#000;border-radius:18px;overflow:hidden;color:#fff;align-self:center}
.vm .fr{aspect-ratio:16/9;max-width:100%}
.vm iframe{width:100%;height:100%;border:0;display:block}
.vm .meta{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--deep)}
.vm .meta b{font-size:17px;line-height:1.45}
.vm .x{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:70;font-weight:500;font-size:15px}

/* player */
.player{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--tab) + 12px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--deep);color:var(--deep-ink);border-radius:20px;box-shadow:0 20px 50px -14px rgba(0,0,0,.55);overflow:hidden;max-width:1240px;margin:0 auto}
.player .line{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.12)}
.player .line i{display:block;height:100%;background:var(--kesri)}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.1fr) auto;gap:20px;align-items:center;padding:12px 16px}
.np{display:flex;gap:12px;align-items:center;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.np .art{width:52px;font-size:10px;padding:4px;border-radius:10px;flex:none}
.np div{min-width:0}
.np div b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np div span{display:block;font-size:13px;color:var(--deep-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:4px}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:none;color:var(--deep-ink);cursor:pointer;display:grid;place-items:center;position:relative}
.ib:hover{background:rgba(255,255,255,.1)}
.ib small{position:absolute;font-size:9px;font-weight:700;bottom:7px}
.ib.main{width:52px;height:52px;background:var(--kesri);color:#2a1503}
.ib.main:hover{background:#f59d3d}
.ib.main .icon{width:20px;height:20px}
.seek{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--deep-muted);font-variant-numeric:tabular-nums}
.seek input{flex:1;min-width:0;accent-color:var(--kesri)}
.ext{display:flex;gap:6px;align-items:center}
.pill{height:32px;border:1px solid rgba(255,255,255,.2);background:none;color:var(--deep-ink);border-radius:999px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--kesri);color:#2a1503;border-color:var(--kesri)}
.pbig{display:none}
.player .down{display:none}
@media (max-width:1000px){
  .pl{grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 10px 10px 12px}
  .seek,.ext,.ctl .opt{display:none}
  .player.open{top:max(12px,env(safe-area-inset-top,0px));border-radius:24px;display:flex;flex-direction:column}
  .player.open .pl{grid-template-columns:1fr;gap:22px;padding:20px 22px 28px;margin-top:auto}
  .player.open .pbig{display:grid;place-items:center;flex:1;padding:56px 28px 0}
  .player.open .pbig .art{width:min(72vw,360px);font-size:clamp(26px,7vw,40px);border-radius:24px;padding:24px}
  .player.open .np{flex-direction:column;align-items:flex-start}
  .player.open .np .art{display:none}
  .player.open .np div b{white-space:normal;font-size:20px}
  .player.open .seek,.player.open .ext{display:flex}
  .player.open .ctl{justify-content:space-between}
  .player.open .ctl .opt{display:grid}
  .player.open .ext{justify-content:center}
  .player.open .line{display:none}
  .player .down{display:none}
  .player.open .down{display:grid;position:absolute;left:14px;top:14px}
}

/* responsive */
@media (max-width:1000px){
  .hero .wrap{grid-template-columns:1fr;gap:26px;padding-block:28px 40px}
  .hero .stage{order:-1}
  .hero::after{background:linear-gradient(180deg,rgba(14,16,34,.5),rgba(14,16,34,.92))}
  .topics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .about{grid-template-columns:1fr;gap:0}
  .about .ph{min-height:300px}
  .about .tx{padding:28px}
  .today{grid-template-columns:1fr}
  .today .art{min-height:160px}
  footer .wrap{grid-template-columns:1fr}
}
@media (max-width:760px){
  .sec{padding-block:36px 0}
  .shead{grid-template-columns:110px minmax(0,1fr);gap:18px;align-items:center}
  .shead .acts{grid-column:1 / -1}
  .shead .art{font-size:17px;padding:10px}
  .grid-books{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
  .row .d{display:none}
  .topic{min-height:120px}
  .rail{--col:78%}
  .rail.books{--col:42%}
  .today .tx{padding:20px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  var navKey=view==='topic'?'topics':view==='series'?'listen':view;
  document.querySelectorAll('[data-nav]').forEach(function(a){if(a.dataset.nav===navKey)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});

  types.forEach(function(c){var b=el('button','chip',c==='All'?t('all'):c);b.type='button';b.setAttribute('aria-pressed',String(LS.type===c));
    b.onclick=function(){LS.type=c;[].forEach.call(ch.children,function(x){x.setAttribute('aria-pressed',String(x===b))});draw()};ch.appendChild(b)});
  tb.appendChild(ch);var sel=el('select','sort');sel.id='sort';sel.setAttribute('aria-label','Sort');[['new','sortnew'],['az','sortaz'],['big','sortbig']].forEach(function(o){var op=el('option',null,t(o[1]));op.value=o[0];sel.appendChild(op)});
  sel.value=LS.sort;sel.onchange=function(){LS.sort=sel.value;draw()};tb.appendChild(sel);w.appendChild(tb);
  var grid=el('div','grid-books');w.appendChild(grid);v.appendChild(w);
  function draw(){grid.textContent='';S.series.filter(function(s){return LS.type==='All'||s.category===LS.type}).sort(function(a,b){
    if(LS.sort==='az')return name(a).localeCompare(name(b));if(LS.sort==='big')return b.tracks.length-a.tracks.length;return a.latest<b.latest?1:a.latest>b.latest?-1:0})
    .forEach(function(s){grid.appendChild(book(s))})}
  draw();
}

// ---------- watch
var WS={topic:'all',shown:24};
function watch(){
  var v=$('v-watch');v.textContent='';var w=el('div','wrap');var ph=el('div','phead');ph.appendChild(el('h1',null,t('watchh')));ph.appendChild(el('p',null,t('watchp')));w.appendChild(ph);
  var tb=el('div','toolbar'),ch=el('div','chips');var opts=[{id:'all',label:t('all')}].concat(S.topics.filter(function(tp){return tp.vids.length}).map(function(tp){return{id:tp.id,label:(LANG==='pa'?tp.gurmukhi:tp.english)+' '+tp.vids.length}}));
  opts.forEach(function(o){var b=el('button','chip',o.label);b.type='button';b.setAttribute('aria-pressed',String(WS.topic===o.id));b.onclick=function(){WS.topic=o.id;WS.shown=24;[].forEach.call(ch.children,function(x){x.setAttribute('aria-pressed',String(x===b))});draw()};ch.appendChild(b)});
  tb.appendChild(ch);w.appendChild(tb);var grid=el('div','grid-v');w.appendChild(grid);var more=el('div','acts');more.style.cssText='justify-content:center;margin-top:32px';w.appendChild(more);v.appendChild(w);
  function draw(){grid.textContent='';more.textContent='';var list=WS.topic==='all'?S.videos:(S.topics.filter(function(x){return x.id===WS.topic})[0]||{vids:[]}).vids;
    list.slice(0,WS.shown).forEach(function(x){grid.appendChild(vcard(x))});if(!list.length)grid.appendChild(el('p','muted',t('nothing')));
    if(list.length>WS.shown){var mb=el('button','btn soft',t('more'));mb.type='button';mb.onclick=function(){WS.shown+=24;draw()};more.appendChild(mb)}
    var yt=el('a','btn soft','YouTube');yt.href=(S.cfg&&S.cfg.youtube_url)||'#';yt.target='_blank';yt.rel='noopener';more.appendChild(yt)}
  draw();
}

// ---------- topics
function topics(){var v=$('v-topics');v.textContent='';var w=el('div','wrap');var ph=el('div','phead');ph.appendChild(el('h1',null,t('topicsh')));ph.appendChild(el('p',null,t('topicsp')));w.appendChild(ph);
  var g=topicGrid(S.topics);g.style.marginTop='24px';w.appendChild(g);v.appendChild(w)}
function topic(id){
  var tp=S.topics.filter(function(x){return x.id===id})[0];var v=$('v-topic');v.textContent='';if(!tp){location.hash='#/topics';return}
  var hd=el('section','thead');hd.style.background='linear-gradient(150deg,'+tp.hue[0]+','+tp.hue[1]+')';var hw=el('div','wrap');
  var bk=el('a','back','← '+t('back'));bk.href='#/topics';hw.appendChild(bk);hw.appendChild(el('h1',null,tp.gurmukhi));
  hw.appendChild(el('p',null,tp.english+'. '+tp.about));hd.appendChild(hw);v.appendChild(hd);
  if(tp.vids.length){var s1=el('section','sec'),w1=el('div','wrap');w1.appendChild(sh(t('videos')+' ('+tp.vids.length+')'));var g1=el('div','grid-v');tp.vids.forEach(function(x){g1.appendChild(vcard(x))});w1.appendChild(g1);s1.appendChild(w1);v.appendChild(s1)}
  if(tp.ser.length){var s2=el('section','sec'),w2=el('div','wrap');w2.appendChild(sh(t('series')+' ('+tp.ser.length+')'));var g2=el('div','grid-books');tp.ser.forEach(function(s){g2.appendChild(book(s))});w2.appendChild(g2);s2.appendChild(w2);v.appendChild(s2)}
  if(!tp.vids.length&&!tp.ser.length){var e=el('div','wrap');e.appendChild(el('p','muted',t('nothing')));v.appendChild(e)}
}

// ---------- series
var order='new';
function series(id){
  var s=S.byId[id],v=$('v-series');v.textContent='';if(!s){location.hash='#/listen';return}
  var w=el('div','wrap'),hd=el('div','shead');var a=el('div','art');paint(a,s);hd.appendChild(a);var tx=el('div');
  tx.appendChild(el('h1',null,s.gurmukhi||s.title));if(s.gurmukhi)tx.appendChild(el('div','en',s.title));
  tx.appendChild(el('div','meta',s.tracks.length.toLocaleString('en-GB')+' '+t('recs')+(s.latest?'. '+t('lastadded')+' '+fdate(s.latest):'')));
  var acts=el('div','acts');var resume=s.tracks.filter(function(x){var q=store.get('pos:'+x.p,null);return q&&q.d&&q.t>20&&q.t<q.d-20}).sort(function(a,b){return(store.get('pos:'+b.p,{}).at||0)-(store.get('pos:'+a.p,{}).at||0)})[0];
  var pb=el('button','btn primary');pb.type='button';pb.appendChild(svg('i-play'));pb.appendChild(document.createTextNode(resume?t('resume'):t('start')));
  pb.onclick=function(){if(resume)play(resume,s.tracks);else play(s.tracks[0],s.tracks)};acts.appendChild(pb);
  var seg=el('div','seg');[['new','newest'],['part','inorder']].forEach(function(o){var b=el('button',null,t(o[1]));b.type='button';b.setAttribute('aria-pressed',String(order===o[0]));
    b.onclick=function(){order=o[0];[].forEach.call(seg.children,function(x){x.setAttribute('aria-pressed',String(x===b))});draw()};seg.appendChild(b)});acts.appendChild(seg);
  var shb=el('button','btn soft small');shb.type='button';shb.appendChild(svg('i-share'));shb.appendChild(document.createTextNode(t('share')));shb.onclick=function(){share(name(s),location.href)};acts.appendChild(shb);
  tx.appendChild(acts);hd.appendChild(tx);w.appendChild(hd);var rows=el('div','rows');w.appendChild(rows);v.appendChild(w);
  var pre=commonPrefix(s.tracks,s.title);
  function draw(){rows.textContent='';var list=order==='new'?s.tracks.slice().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:a.i-b.i}):s.tracks,g=null;
    list.forEach(function(x){if(order==='part'&&x.g&&x.g!==g){g=x.g;rows.appendChild(el('div','grp',g))}
      rows.appendChild(trow(x,{title:short(x,pre),sub:order==='new'?(x.g||''):'',queue:list}))});mark()}
  draw();
}
function commonPrefix(ts,title){if(ts.length<2)return'';var a=ts[0].t,z=ts[ts.length-1].t,i=0;while(i<a.length&&a[i]===z[i])i++;var cut=a.slice(0,i).replace(/[^\s–-]*$/,'');return cut.length>4?cut:''}
function short(x,pre){var r=pre&&x.t.indexOf(pre)===0?x.t.slice(pre.length).replace(/^[\s–-]+/,''):x.t;return r||x.t}

// ---------- search
function openSearch(){$('search').hidden=false;document.body.style.overflow='hidden';$('sq').value='';doSearch();$('sq').focus()}
function closeSearch(){$('search').hidden=true;document.body.style.overflow=''}
$('open-search').onclick=openSearch;$('sq-close').onclick=closeSearch;$('search').addEventListener('click',function(e){if(e.target===this)closeSearch()});
var st;$('sq').addEventListener('input',function(){clearTimeout(st);st=setTimeout(doSearch,100)});
function norm(s){return(s||'').toLowerCase().replace(/[_\-–.]/g,' ').replace(/\s+/g,' ')}
function doSearch(){
  var q=norm($('sq').value.trim()),box=$('sres');box.textContent='';if(q.length<2){box.appendChild(el('div','hint',t('hint')));return}
  var tp=S.topics.filter(function(x){return norm(x.gurmukhi+' '+x.english).indexOf(q)>=0});
  var ser=S.series.filter(function(s){return norm(s.title+' '+s.gurmukhi).indexOf(q)>=0}).slice(0,6);
  var vi=S.videos.filter(function(v){return norm(v.title+' '+v.description).indexOf(q)>=0}).slice(0,6);
  var tr=S.all.filter(function(x){return norm(x.t+' '+(x.g||'')).indexOf(q)>=0}).slice(0,30);
  function go(h){return function(){closeSearch();location.hash=h}}
  if(tp.length){box.appendChild(el('h4',null,t('topics')));tp.forEach(function(x){var b=el('button','row');b.type='button';var pp=el('span','pp');pp.style.background=x.hue[0];b.appendChild(pp);
    var tx=el('span','t');tx.appendChild(el('b',null,x.gurmukhi+'  '+x.english));tx.appendChild(el('span',null,x.about));b.appendChild(tx);b.appendChild(el('span'));b.onclick=go('#/topic/'+x.id);box.appendChild(b)})}
  if(ser.length){box.appendChild(el('h4',null,t('series')));ser.forEach(function(s){var b=el('button','row');b.type='button';var a=el('span','art');a.style.cssText='width:40px;font-size:7px;padding:2px;border-radius:8px';paint(a,s);b.appendChild(a);
    var tx=el('span','t');tx.appendChild(el('b',null,name(s)));tx.appendChild(el('span',null,s.tracks.length+' '+t('recs')));b.appendChild(tx);b.appendChild(el('span'));b.onclick=go('#/series/'+s.id);box.appendChild(b)})}
  if(vi.length){box.appendChild(el('h4',null,t('videos')));vi.forEach(function(v){var b=el('button','row');b.type='button';var pp=el('span','pp');pp.appendChild(svg('i-play'));b.appendChild(pp);
    var tx=el('span','t');tx.appendChild(el('b',null,clean(v.title)));tx.appendChild(el('span',null,fdate(v.published)));b.appendChild(tx);b.appendChild(el('span'));b.onclick=function(){closeSearch();openVideo(v)};box.appendChild(b)})}
  if(tr.length){box.appendChild(el('h4',null,t('recs')));tr.forEach(function(x){box.appendChild(trow(x,{sub:name(x.s)+(x.g?'. '+x.g:''),queue:tr}))})}
  if(!box.children.length)box.appendChild(el('div','hint',t('noresults')));mark();
}

// ---------- video
function openVideo(v){pause();$('vtitle').textContent=clean(v.title);var f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+v.id+'?autoplay=1&rel=0';
  f.title=v.title;f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;$('vframe').textContent='';$('vframe').appendChild(f);
  $('vbox').hidden=false;document.body.style.overflow='hidden';$('vclose').focus()}
function closeVideo(){$('vframe').textContent='';$('vbox').hidden=true;document.body.style.overflow=''}
$('vclose').onclick=closeVideo;$('vbox').addEventListener('click',function(e){if(e.target===this)closeVideo()});

document.addEventListener('keydown',function(e){var typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='Escape'){if(!$('vbox').hidden)closeVideo();else if(!$('search').hidden)closeSearch();else $('player').classList.remove('open')}
  else if((e.key==='/'&&!typing)||(e.key==='k'&&(e.metaKey||e.ctrlKey))){e.preventDefault();openSearch()}
  else if(e.key===' '&&!typing&&Q.cur&&!/BUTTON|A/.test(document.activeElement.tagName)){e.preventDefault();toggle()}});

// ---------- share + toast
function toast(msg){var n=el('div','toast',msg);document.body.appendChild(n);setTimeout(function(){n.remove()},1800)}
function share(title,url){if(navigator.share){navigator.share({title:title,url:url}).catch(function(){})}else{try{navigator.clipboard.writeText(url).then(function(){toast(t('copied'))},function(){toast(url)})}catch(e){toast(url)}}}

// ---------- player
var A=$('audio'),Q={list:[],cur:null},SPEEDS=[1,1.25,1.5,0.75],sp=store.get('speed',1),SLEEPS=[0,15,30,60,-1],sleepI=0,sleepAt=0;
function enc(p){return p.split('/').map(function(x){return encodeURIComponent(x).replace(/\(/g,'%28').replace(/\)/g,'%29')}).join('/')}
function play(x,list,quiet){
  Q.list=list||x.s.tracks;Q.cur=x;A.src=S.base+enc(x.p);A.playbackRate=sp;var pos=store.get('pos:'+x.p,null);
  A.addEventListener('loadedmetadata',function(){if(pos&&pos.t&&pos.t<pos.d-20)A.currentTime=pos.t;A.playbackRate=sp},{once:true});
  if(!quiet)A.play().catch(function(){});$('player').hidden=false;document.body.classList.add('playing');
  paint($('p-art'),x.s);paint($('p-bigart'),x.s);$('p-title').textContent=x.t;$('p-series').textContent=name(x.s)+(x.g?'. '+x.g:'');
  var rec=store.get('recent',[]).filter(function(p){return p!==x.p});rec.unshift(x.p);store.set('recent',rec.slice(0,12));store.set('last',x.p);
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:x.t,artist:'Sant Baba Jagjit Singh Ji Harkhowal',album:x.s.title,artwork:[{src:'images/babaji.jpg',sizes:'861x921',type:'image/jpeg'}]})}catch(e){}}
  mark();
}
function toggle(){if(!Q.cur)return;if(A.paused)A.play().catch(function(){});else A.pause()}
function pause(){if(!A.paused)A.pause()}
function step(d){if(!Q.cur)return;var i=Q.list.indexOf(Q.cur)+d;if(i>=0&&i<Q.list.length)play(Q.list[i],Q.list)}
function mark(){var playing=Q.cur&&!A.paused;$('p-play').querySelector('use').setAttribute('href',playing?'#i-pause':'#i-play');$('p-play').setAttribute('aria-label',playing?'Pause':'Play');
  document.querySelectorAll('.row[data-p]').forEach(function(r){var on=!!(Q.cur&&r.dataset.p===Q.cur.p);r.classList.toggle('on',on);var u=r.querySelector('.pp use');if(u)u.setAttribute('href',on&&playing?'#i-pause':'#i-play')})}
A.addEventListener('play',mark);A.addEventListener('pause',mark);
A.addEventListener('ended',function(){if(Q.cur)store.set('pos:'+Q.cur.p,{t:A.duration,d:A.duration,at:Date.now()});if(SLEEPS[sleepI]===-1){sleepI=0;sleepLabel();mark();return}step(1)});
var lastSave=0,dragging=false;
A.addEventListener('timeupdate',function(){var d=A.duration||0,c=A.currentTime||0;$('p-cur').textContent=clock(c);$('p-dur').textContent=clock(d);
  if(d&&!dragging)$('p-seek').value=Math.round(c/d*1000);$('p-line').style.width=(d?c/d*100:0)+'%';
  if(Q.cur&&d&&Date.now()-lastSave>5000){lastSave=Date.now();store.set('pos:'+Q.cur.p,{t:c,d:d,at:Date.now()})}
  if(sleepAt&&Date.now()>=sleepAt){sleepAt=0;sleepI=0;sleepLabel();A.pause()}});
A.addEventListener('error',function(){if(Q.cur&&A.getAttribute('src'))$('p-series').textContent=t('loadfail')});
$('p-seek').addEventListener('input',function(){dragging=true;if(A.duration)$('p-cur').textContent=clock(this.value/1000*A.duration)});
$('p-seek').addEventListener('change',function(){if(A.duration)A.currentTime=this.value/1000*A.duration;dragging=false});
$('p-play').onclick=toggle;$('p-next').onclick=function(){step(1)};$('p-prev').onclick=function(){if(A.currentTime>5)A.currentTime=0;else step(-1)};
$('p-back').onclick=function(){A.currentTime=Math.max(0,A.currentTime-15)};$('p-fwd').onclick=function(){A.currentTime=Math.min(A.duration||0,A.currentTime+30)};
function speedLabel(){$('p-speed').textContent=String(sp).replace(/^0/,'')+'×'}speedLabel();
$('p-speed').onclick=function(){sp=SPEEDS[(SPEEDS.indexOf(sp)+1)%SPEEDS.length];A.playbackRate=sp;store.set('speed',sp);speedLabel()};
function sleepLabel(){var v=SLEEPS[sleepI];var b=$('p-sleep');b.classList.toggle('on',v!==0);b.textContent=v===0?t('sleep'):v===-1?t('sleepend'):t('sleep')+' '+v+' '+t('min')}
$('p-sleep').onclick=function(){sleepI=(sleepI+1)%SLEEPS.length;var v=SLEEPS[sleepI];sleepAt=v>0?Date.now()+v*60000:0;sleepLabel();toast($('p-sleep').textContent)};
$('p-close').onclick=function(){A.pause();$('player').hidden=true;$('player').classList.remove('open');document.body.classList.remove('playing')};
$('p-np').onclick=function(){if(window.matchMedia('(max-width:1000px)').matches)$('player').classList.add('open');else if(Q.cur)location.hash='#/series/'+Q.cur.s.id};
$('p-down').onclick=function(){$('player').classList.remove('open')};
if('mediaSession' in navigator){try{[['play',function(){A.play()}],['pause',function(){A.pause()}],['previoustrack',function(){step(-1)}],['nexttrack',function(){step(1)}],
  ['seekbackward',function(){A.currentTime=Math.max(0,A.currentTime-15)}],['seekforward',function(){A.currentTime+=30}]].forEach(function(h){navigator.mediaSession.setActionHandler(h[0],h[1])})}catch(e){}}
function restore(){var p=store.get('last',null),x=p&&S.byP[p];if(x)play(x,x.s.tracks,true)}

// ---------- footer
function footer(cfg,a,v){var s=cfg.social||{},names={youtube:'YouTube',facebook:'Facebook',tiktok:'TikTok'};
  Object.keys(names).forEach(function(k){if(s[k]){var x=el('a',null,names[k]);x.href=s[k];x.target='_blank';x.rel='noopener';$('links').appendChild(x)}});
  if(cfg.contact_email)$('email').textContent=cfg.contact_email;var u=[a.updated,v.updated].filter(Boolean).sort().pop();
  if(u){var upd=$('updated');upd.dataset.date=u}}
var cb=$('copy');cb.onclick=function(){var txt=$('email').textContent;function sel(){var r=document.createRange();r.selectNodeContents($('email'));var s=getSelection();s.removeAllRanges();s.addRange(r)}
  try{navigator.clipboard.writeText(txt).then(function(){toast(t('copied').replace(/Link|ਲਿੰਕ/,'Email'))},sel)}catch(e){sel()}};
var _al=applyLang;applyLang=function(){_al();var u=$('updated');if(u.dataset.date)u.textContent=t('updated')+' '+fdate(u.dataset.date)+'.'};
})();
</script>
