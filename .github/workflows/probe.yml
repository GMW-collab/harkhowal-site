name: Probe audio host
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p debug
          U="https://www.gurmatveechar.com/audios/Katha/02_Present_Day_Katha/Baba_Jagjit_Singh_%28Harkhowal_wale%29/Vichar_Sagar/Baba.Jagjit.Singh.%28Harkhowal.wale%29--Vichar.Sagar.Part.01.mp3"
          { echo "== no referer"; curl -sS -I "$U";
            echo "== foreign referer + range"; curl -sS -D - -o /dev/null -H "Referer: https://gmw-collab.github.io/harkhowal-site/" -H "Range: bytes=0-1023" "$U";
            echo "== origin header"; curl -sS -I -H "Origin: https://gmw-collab.github.io" "$U"; } > debug/probe.txt 2>&1
          git config user.name "harkhowal-bot"; git config user.email "actions@users.noreply.github.com"
          git add debug; git commit -m "probe"; git push
