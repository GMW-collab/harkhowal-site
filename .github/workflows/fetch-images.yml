name: Fetch site images
on: workflow_dispatch
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p images
          curl -sSfL "https://static.wixstatic.com/media/01ef28_f640242b084842d59d7f7d1f78e6ceba~mv2.jpg" -o images/babaji.jpg
          curl -sSfL "https://static.wixstatic.com/media/01ef28_3c980c3b7ee8451b998f0da41ff8154e~mv2.jpg" -o images/sant-jawala-singh-ji.jpg
          curl -sSfL "https://static.wixstatic.com/media/01ef28_fb977aaa57d144f5901bf4275df30378~mv2.jpg" -o images/dera.jpg
          ls -la images
          git config user.name "harkhowal-bot"; git config user.email "actions@users.noreply.github.com"
          git add images; git commit -m "Add photographs from the previous site"; git push
