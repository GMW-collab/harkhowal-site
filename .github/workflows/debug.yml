name: Debug page snapshot
on: workflow_dispatch
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p debug
          curl -sS -A "HarkhowalOnline-updater/1.0" "https://www.gurmatveechar.com/audio.php?q=f&f=%2FKatha%2F02_Present_Day_Katha%2FBaba_Jagjit_Singh_%28Harkhowal_wale%29" -o debug/root.html
          curl -sS -A "HarkhowalOnline-updater/1.0" "https://www.gurmatveechar.com/audio.php?q=f&f=%2FKatha%2F02_Present_Day_Katha%2FBaba_Jagjit_Singh_%28Harkhowal_wale%29%2FVichar_Sagar" -o debug/sub.html
          git config user.name "harkhowal-bot"; git config user.email "actions@users.noreply.github.com"
          git add debug; git commit -m "debug snapshot"; git push
